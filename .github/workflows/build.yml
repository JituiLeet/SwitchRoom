name: Build Switch Room

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the Windows installer (Inno Setup)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows application
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 `
            -Version 1.0.3 `
            -OutputDirectory packages `
            -NonInteractive
          $referencePath = Join-Path $PWD 'packages/Microsoft.NETFramework.ReferenceAssemblies.net40/build/.NETFramework/v4.0'
          if (!(Test-Path $referencePath)) {
            throw " .NET Framework 4.0 reference assemblies not found: $referencePath"
          }
          "FRAMEWORK_REFERENCE_PATH=$referencePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Release
        shell: pwsh
        run: |
          msbuild SwitchRoom.sln /t:Rebuild /m /p:Configuration=Release /p:Platform="Any CPU" /p:FrameworkPathOverride="$env:FRAMEWORK_REFERENCE_PATH" /verbosity:minimal
          if (!(Test-Path 'bin/Release/Switch Room.exe')) {
            throw 'Build output was not found.'
          }

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item 'bin/Release/Switch Room.exe' 'artifacts/SwitchRoom.exe'
          Compress-Archive -Path 'bin/Release/Switch Room.exe' -DestinationPath 'artifacts/SwitchRoom-Portable.zip' -Force

      - name: Install Inno Setup
        if: ${{ inputs.build_installer }}
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: ${{ inputs.build_installer }}
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          & $iscc 'installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          Copy-Item 'installer-output/SwitchRoom-Setup-1.0.0.exe' 'artifacts/SwitchRoom-Setup-1.0.0.exe'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwitchRoom-Windows-1.0.0
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
